name: CI

# Esteira de qualidade — roda em todo Pull Request contra a main (e também
# na main depois de um merge, como rede de segurança). Ver AGENTS.md, seção
# "Esteira de qualidade", para o racional de cada job e como configurar a
# branch protection pra exigir esses checks antes do merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# O CI só precisa ler o repositório. O commitlint também consulta os commits
# da PR, por isso pull-requests: read é explícito para repositórios privados.
permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    working-directory: frontend

env:
  NODE_VERSION: 22

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next typegen
      - run: npm run knip

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Roda sem as variáveis do Supabase de propósito — @/lib/supabase/admin
      # devolve null sem elas, e toda a camada de leitura trata isso como
      # "banco vazio". O build precisa passar sem segredos no CI.
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    env:
      # Permite que o smoke test exercite as páginas protegidas sem uma conta
      # real do Supabase. O middleware só aceita o bypass quando CI=true.
      E2E_AUTH_BYPASS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    env:
      # O Lighthouse precisa visitar as páginas protegidas para medir o portal.
      # O bypass é restrito ao CI pelo middleware.
      E2E_AUTH_BYPASS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Sobe o servidor de produção em segundo plano
        run: npm run start &
      - name: Espera o servidor responder
        run: npx wait-on http://localhost:3002 --timeout 120000
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./frontend/.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
