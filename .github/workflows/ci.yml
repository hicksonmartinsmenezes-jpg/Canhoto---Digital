name: CI

# Esteira de qualidade — roda em todo Pull Request, inclusive PRs empilhados,
# e também na main depois de um merge. Ver AGENTS.md, seção
# "Esteira de qualidade", para o racional de cada job e como configurar a
# branch protection pra exigir esses checks antes do merge.

on:
  pull_request: {}
  push:
    branches: [main]

# O CI só precisa ler o repositório. O commitlint também consulta os commits
# da PR, por isso pull-requests: read é explícito para repositórios privados.
permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    working-directory: frontend

env:
  NODE_VERSION: 22

jobs:
  postgres-schema:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      CANHOTO_POSTGRES_DB: canhoto_ci
      CANHOTO_POSTGRES_USER: canhoto_ci
      CANHOTO_POSTGRES_PASSWORD: senha_apenas_para_ci
      CANHOTO_POSTGRES_PORT: 5433
    steps:
      - uses: actions/checkout@v7
      - name: Valida o Docker Compose
        run: docker compose config --quiet
      - name: Sobe o PostgreSQL descartável
        run: docker compose up -d postgres
      - name: Aguarda o banco ficar saudável
        run: |
          for tentativa in {1..30}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' canhoto_digital_postgres)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres
          exit 1
      - name: Aplica as migrations PostgreSQL
        run: |
          for migration in backend/postgres/migrations/*.sql; do
            echo "Aplicando $migration"
            cat "$migration" |
              docker exec -i canhoto_digital_postgres \
                psql -v ON_ERROR_STOP=1 -U canhoto_ci -d canhoto_ci
          done
      - name: Verifica tabelas essenciais
        run: |
          tabelas="$(docker exec canhoto_digital_postgres \
            psql -At -U canhoto_ci -d canhoto_ci \
            -c "select count(*) from information_schema.tables where table_schema = 'public' and table_name in ('setores','colaboradores','usuarios_admin','motoboys','motoboy_localizacoes','veiculos','veiculo_gastos','treinamento_progresso','entregas','entrega_anexos','entrega_historico','dispositivos_push','login_rate_limits');")"
          test "$tabelas" = "13"
      - name: Testa o bloqueio persistente de login
        run: |
          hash="$(printf '%064d' 0 | tr '0' 'a')"

          for tentativa in {1..8}; do
            permitido="$(docker exec canhoto_digital_postgres \
              psql -At -U canhoto_ci -d canhoto_ci \
              -c "select registrar_tentativa_login('loginMotorista', '$hash');")"
            test "$permitido" = "t"
          done

          bloqueado="$(docker exec canhoto_digital_postgres \
            psql -At -U canhoto_ci -d canhoto_ci \
            -c "select registrar_tentativa_login('loginMotorista', '$hash');")"
          test "$bloqueado" = "f"

          # O mesmo identificador em outro fluxo não compartilha o bloqueio.
          admin_permitido="$(docker exec canhoto_digital_postgres \
            psql -At -U canhoto_ci -d canhoto_ci \
            -c "select registrar_tentativa_login('entrarAdmin', '$hash');")"
          test "$admin_permitido" = "t"

          docker exec canhoto_digital_postgres \
            psql -v ON_ERROR_STOP=1 -U canhoto_ci -d canhoto_ci \
            -c "select limpar_tentativas_login('loginMotorista', '$hash');"

          liberado="$(docker exec canhoto_digital_postgres \
            psql -At -U canhoto_ci -d canhoto_ci \
            -c "select registrar_tentativa_login('loginMotorista', '$hash');")"
          test "$liberado" = "t"
      - name: Cria comprovante descartável para validar backup
        run: |
          entrega_id="11111111-1111-4111-8111-111111111111"
          mkdir -p "storage/uploads/entregas/$entrega_id"
          printf 'arquivo-de-teste-do-backup' > "storage/uploads/entregas/$entrega_id/foto-ci.png"

          docker exec canhoto_digital_postgres \
            psql -v ON_ERROR_STOP=1 -U canhoto_ci -d canhoto_ci \
            -c "insert into entregas (id, cliente_nome, valor_pagamento, forma_pagamento, status) values ('$entrega_id', 'Backup CI', 1.00, 'pix', 'entregue'); insert into entrega_anexos (entrega_id, tipo, arquivo_url) values ('$entrega_id', 'foto', 'entregas/$entrega_id/foto-ci.png');"
      - name: Valida backup completo e restauração
        run: |
          pwsh -NoProfile -File ops/backup/backup-postgres.ps1
          pwsh -NoProfile -File ops/backup/test-restore.ps1
      - name: Derruba o banco descartável
        if: always()
        run: docker compose down -v

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next typegen
      - run: npm run knip

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache do Next.js
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('frontend/package-lock.json') }}
      - run: npm ci
      # Roda sem DATABASE_URL de propósito. getDb() devolve null e a camada
      # de leitura retorna o estado vazio que a UI já sabe renderizar.
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    env:
      # Permite que o smoke test exercite as páginas protegidas sem criar
      # uma conta Admin real. O Proxy só aceita o bypass quando CI=true.
      E2E_AUTH_BYPASS: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    env:
      # O Lighthouse precisa visitar as páginas protegidas para medir o portal.
      # O bypass é restrito ao CI pelo Proxy.
      E2E_AUTH_BYPASS: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache do Next.js
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('frontend/package-lock.json') }}
      - run: npm ci
      - run: npm run build
      - name: Sobe o servidor de produção em segundo plano
        run: npm run start &
      - name: Espera o servidor responder
        run: npx wait-on http://localhost:3003 --timeout 120000
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./frontend/.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
