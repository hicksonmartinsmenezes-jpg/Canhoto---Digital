name: canhoto-digital

services:
  geocoder:
    build:
      context: ./backend/geocoder
    container_name: canhoto_digital_geocoder
    restart: "no"

    environment:
      GEOCODEBR_CACHE_DIR: /data/geocodebr

    ports:
      - "127.0.0.1:${CANHOTO_GEOCODER_PORT:-8001}:8000"

    volumes:
      - canhoto_geocoder_cache:/data/geocodebr

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m

    networks:
      - canhoto_internal

  postgres:
    image: postgres:16
    container_name: canhoto_digital_postgres
    restart: "no"
    stop_grace_period: 30s

    environment:
      POSTGRES_DB: ${CANHOTO_POSTGRES_DB}
      POSTGRES_USER: ${CANHOTO_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CANHOTO_POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${CANHOTO_POSTGRES_PORT:-5433}:5432"

    volumes:
      - canhoto_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - canhoto_internal

volumes:
  canhoto_postgres_data:
    name: canhoto_postgres_data
  canhoto_geocoder_cache:
    name: canhoto_geocoder_cache

networks:
  canhoto_internal:
    name: canhoto_internal
    driver: bridge
