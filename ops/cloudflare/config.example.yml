tunnel: <TUNNEL_UUID>
credentials-file: C:\Windows\System32\config\systemprofile\.cloudflared\<TUNNEL_UUID>.json

# O hostname público aponta para o Next.js, nunca para o PostgreSQL.
ingress:
  - hostname: <PUBLIC_MOTORISTA_HOST>
    service: http://127.0.0.1:3003
  - service: http_status:404

logfile: C:\Cloudflared\cloudflared.log
