<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A1F44" />
<title>Motorista</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    min-height: 100%;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #0A1F44;
  }
  body {
    min-height: 100vh;
    background: #FFFFFF; /* splash: igual ao do PWA (fundo branco + ícone) */
    padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
    padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-left: 16px;
    padding-right: 16px;
  }

  .splash-icone {
    width: 168px;
    height: 168px;
    object-fit: contain;
    animation: pulso 1.8s ease-in-out infinite;
  }
  @keyframes pulso {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.04); opacity: .88; }
  }
  .status {
    margin-top: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 600;
    color: #64748B;
    min-height: 20px;
    text-align: center;
  }
  .spinner {
    width: 16px;
    height: 16px;
    border-radius: 9999px;
    border: 2px solid #E2E8F0;
    border-top-color: #0A1F44;
    animation: gira .8s linear infinite;
    flex: none;
  }
  .spinner.oculto { display: none; }
  @keyframes gira { to { transform: rotate(360deg); } }

  .aviso {
    display: none;
    margin-top: 20px;
    max-width: 320px;
    padding: 12px 16px;
    border: 1px solid #FECACA;
    background: #FEF2F2;
    color: #B91C1C;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    text-align: center;
  }
  .aviso.visivel { display: block; }

  .botao {
    margin-top: 16px;
    padding: 12px 24px;
    border: none;
    border-radius: 0;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform .15s, background-color .15s;
  }
  .botao.visivel { display: inline-flex; }
  .botao:active { transform: scale(.99); }
  .botao svg { width: 16px; height: 16px; }
  .botao-principal { background: #0A1F44; color: #fff; }
  .botao-secundario {
    background: #fff;
    color: #334155;
    border: 1px solid #CBD5E1;
  }
</style>
</head>
<body>

  <img class="splash-icone" src="icone-splash.png" alt="Rildon Express" />
  <div class="status">
    <span class="spinner" id="spinner" aria-hidden="true"></span>
    <span id="status">Conectando…</span>
  </div>
  <div class="aviso" id="aviso" role="alert"></div>
  <button class="botao botao-principal" id="btnTentar" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
    Tentar novamente
  </button>
  <button class="botao botao-secundario" id="btnAbrirSalvo" type="button">Abrir o app salvo (sem conexão)</button>

<script>
(function () {
  // Domínio fixo da loja (VPS Hostinger + Caddy). Antes disso o app descobria
  // o endereço sozinho (túnel Cloudflare trocava a cada reinício + tela de
  // "informar endereço do servidor" como fallback) — com domínio próprio fixo
  // isso não existe mais: o endereço é sempre o mesmo, sem tela pra digitar.
  var BASE_URL = "https://entregas.rildoneletro.tech";
  var CAMINHO_DESTINO = "/motorista";
  // Arquivo estático (fora do /motorista) que o servidor entrega sem login: se
  // ele carregar como imagem, o servidor está no ar; se a conexão falhar
  // (servidor fora do ar / sem internet), a imagem falha.
  var CAMINHO_SONDA = "/icons/motorista-icon-192.png";
  var TEMPO_SONDA_MS = 8000;
  // Gravada pelo próprio app do motorista (dentro do servidor) quando a lista do
  // dia e a tela "sem conexão" já ficaram guardadas no aparelho. Só com ela o
  // app salvo pode ser aberto sem o servidor responder.
  var CHAVE_OFFLINE_PRONTO = "motorista_offline_pronto";

  var elSpinner = document.getElementById("spinner");
  var elStatus = document.getElementById("status");
  var elAviso = document.getElementById("aviso");
  var elBtnTentar = document.getElementById("btnTentar");
  var elBtnAbrirSalvo = document.getElementById("btnAbrirSalvo");

  var preferences =
    window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences
      ? window.Capacitor.Plugins.Preferences
      : null;

  function prefGet(chave) {
    if (preferences) {
      return preferences.get({ key: chave }).then(function (r) { return r.value || null; });
    }
    try { return Promise.resolve(window.localStorage.getItem(chave)); }
    catch (e) { return Promise.resolve(null); }
  }

  function offlineProntoSalvo() {
    return prefGet(CHAVE_OFFLINE_PRONTO).then(function (valor) { return !!valor; });
  }

  function mostrarCarregando(mensagem) {
    elSpinner.classList.remove("oculto");
    elStatus.textContent = mensagem || "Conectando…";
    elAviso.classList.remove("visivel");
    elBtnTentar.classList.remove("visivel");
    elBtnAbrirSalvo.classList.remove("visivel");
  }

  function mostrarErro(mensagem) {
    elSpinner.classList.add("oculto");
    elStatus.textContent = "Não foi possível conectar";
    elAviso.textContent = mensagem;
    elAviso.classList.add("visivel");
    elBtnTentar.classList.add("visivel");
    offlineProntoSalvo().then(function (pronto) {
      if (pronto) elBtnAbrirSalvo.classList.add("visivel");
    });
  }

  // Abre direto, sem testar o servidor: o app do motorista guarda as telas no
  // aparelho e funciona sem internet.
  function abrirDireto() {
    mostrarCarregando("Abrindo o app salvo…");
    setTimeout(function () {
      window.location.replace(BASE_URL + CAMINHO_DESTINO);
    }, 300);
  }

  // Testa se o servidor responde de verdade (e não só que há internet).
  function sondar() {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var terminou = false;
      var timer = setTimeout(function () {
        if (terminou) return;
        terminou = true;
        img.onload = img.onerror = null;
        reject(new Error("tempo esgotado"));
      }, TEMPO_SONDA_MS);
      img.onload = function () {
        if (terminou) return;
        terminou = true;
        clearTimeout(timer);
        resolve();
      };
      img.onerror = function () {
        if (terminou) return;
        terminou = true;
        clearTimeout(timer);
        reject(new Error("sem resposta"));
      };
      img.src = BASE_URL + CAMINHO_SONDA + "?t=" + Date.now();
    });
  }

  function conectar() {
    mostrarCarregando("Conectando…");
    sondar().then(function () {
      elStatus.textContent = "Abrindo…";
      setTimeout(function () {
        window.location.replace(BASE_URL + CAMINHO_DESTINO);
      }, 150);
    }).catch(function () {
      offlineProntoSalvo().then(function (pronto) {
        if (pronto) {
          abrirDireto();
        } else {
          mostrarErro("Não foi possível falar com o servidor da loja. Verifique sua internet e tente novamente.");
        }
      });
    });
  }

  function iniciar() {
    if (navigator.onLine === false) {
      offlineProntoSalvo().then(function (pronto) {
        if (pronto) {
          abrirDireto();
        } else {
          mostrarErro("Sem internet. Abra o app uma vez com internet para ele poder funcionar sem conexão.");
        }
      });
      return;
    }
    conectar();
  }

  elBtnTentar.addEventListener("click", conectar);
  elBtnAbrirSalvo.addEventListener("click", abrirDireto);

  iniciar();
})();
</script>
</body>
</html>
